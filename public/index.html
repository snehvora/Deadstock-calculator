<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadstock / Overstock Calculator</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="tip"></div>
<header>
  <h1>Stock Planner</h1>
  <nav>
    <a href="index.html" class="on">Deadstock</a>
    <a href="order.html">What to order</a>
  </nav>
  <span class="sub" id="fileinfo">No file loaded</span>
  <span style="flex:1"></span>
  <input type="file" id="file" accept=".xls,.xlsx,.htm,.html,.csv" class="hide">
  <button onclick="document.getElementById('file').click()">Load report</button>
</header>

<div class="wrap">
  <div id="dropzone" class="drop">
    Drop the <b>IdealPurchaseReport</b> file here, or click <b>Load report</b>.<br>
    <span class="sub">Supports the exported .xls (HTML table) and .csv. Everything stays on your machine.</span>
  </div>

  <div id="app" class="hide">
    <div class="controls">
      <div class="fld"><label>Period of data</label>
        <select id="months">
          <option value="1">1 month</option><option value="2">2 months</option>
          <option value="3" selected>3 months</option><option value="4">4 months</option>
          <option value="6">6 months</option><option value="9">9 months</option>
          <option value="12">12 months</option>
        </select></div>
      <div class="fld"><label>Sales below % of stock</label>
        <input type="number" id="thr" value="15" min="0" max="100" step="1" style="width:90px"></div>
      <div class="fld"><label>Min stock</label>
        <input type="number" id="minstock" value="1" min="0" step="1" style="width:90px"></div>
      <div class="fld"><label>Category</label><select id="fcat"></select></div>
      <div class="fld"><label>Brand</label><select id="fbrand"></select></div>
      <div class="fld"><label>Vendor</label><select id="fvend"></select></div>
      <div class="fld"><label>Search</label><input id="q" placeholder="product / id" style="width:190px"></div>
      <div class="fld"><label>Show</label>
        <select id="showmode">
          <option value="all">All results</option>
          <option value="flag">Flagged only</option>
          <option value="unflag">Unflagged only</option>
        </select></div>
      <div class="sep"></div>
      <div class="fld"><label>&nbsp;</label><button class="primary" id="export">Export CSV</button></div>
      <div class="fld"><label>&nbsp;</label><button id="reset">Reset removed/flags</button></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="vizhead">
      <label><input type="checkbox" id="showviz" checked> Show charts</label>
      <span class="sub muted">— charts follow every filter above</span>
    </div>
    <div class="viz" id="viz"></div>

    <div class="tblwrap">
      <table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
    </div>
    <div class="pager">
      <span id="pinfo"></span>
      <button id="prev">Prev</button><button id="next">Next</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
const PAGE = 200;
let VIEW = [], page = 0, sortKey = 'ratio', sortDir = 1;
const removed = new Set(), flagged = new Set();
const $ = id => document.getElementById(id);

/* ---------- the rule ----------
   sales as a % of current stock over the chosen period; anything under the
   threshold is dead or over-stocked. Zero-stock rows can't be overstock. */
function compute(){
  const thr=num($('thr').value), minstock=num($('minstock').value);
  const cat=$('fcat').value, brand=$('fbrand').value, vend=$('fvend').value;
  const q=$('q').value.trim().toLowerCase();
  const mode=$('showmode').value;
  const m=num($('months').value)||1;

  VIEW = ROWS.filter(r=>{
    if(removed.has(r.key)) return false;
    if(r.stock < minstock || r.stock<=0) return false;
    if(r.ratio >= thr) return false;
    if(cat && r.cat!==cat) return false;
    if(brand && r.brand!==brand) return false;
    if(vend && r.vendor!==vend) return false;
    if(mode==='flag' && !flagged.has(r.key)) return false;
    if(mode==='unflag' && flagged.has(r.key)) return false;
    if(q && !((r.name+' '+r.id+' '+r.brand).toLowerCase().includes(q))) return false;
    return true;
  });
  VIEW.forEach(r=>{ r.perMonth=r.sales/m; r.cover = r.perMonth>0 ? r.stock/r.perMonth : Infinity; });
  VIEW.sort((a,b)=>{
    const x=a[sortKey], y=b[sortKey];
    if(typeof x==='string') return sortDir*x.localeCompare(y);
    if(!isFinite(x)&&!isFinite(y)) return 0;
    if(!isFinite(x)) return sortDir; if(!isFinite(y)) return -sortDir;
    return sortDir*((x===y)?0:(x<y?-1:1));
  });
  page=0; render();
}

const COLS = [
  ['id','ID',1],['name','Product',0],['brand','Brand',0],['cat','Category',0],
  ['unit','Unit',0],['stock','Stock',1],['sales','Sales',1],['ratio','Sales %',1],
  ['excess','Excess',1],['perMonth','Sales / mo',1],['cover','Months cover',1],
  ['cost','Unit cost',1],['deadValue','Dead value',1],['vendor','Vendor',0]
];
function render(){
  const thr=num($('thr').value);
  $('head').innerHTML = COLS.map(c=>
    `<th data-k="${c[0]}" class="${c[2]?'num':''}">${c[1]}${sortKey===c[0]?' <span class="ar">'+(sortDir>0?'▲':'▼')+'</span>':''}</th>`
  ).join('') + '<th class="nos">Actions</th>';

  const start=page*PAGE, slice=VIEW.slice(start,start+PAGE);
  $('body').innerHTML = slice.map(r=>{
    const dv=r.excess*r.cost;
    const cls = r.ratio<thr/3 ? 'd0' : (r.ratio<thr*2/3 ? 'd1' : 'd2');
    return `<tr class="${flagged.has(r.key)?'flagged':''}">
      <td class="num">${esc(r.id)}</td>
      <td class="name">${esc(r.name)}<div class="muted" style="font-size:11px">${esc(r.sub)}</div></td>
      <td>${esc(r.brand)}</td><td>${esc(r.cat)}</td><td>${esc(r.unit)}</td>
      <td class="num">${r.stock.toFixed(2)}</td>
      <td class="num">${r.sales.toFixed(2)}</td>
      <td class="num pct ${cls}">${r.ratio.toFixed(1)}%</td>
      <td class="num">${r.excess.toFixed(2)}</td>
      <td class="num">${r.perMonth.toFixed(2)}</td>
      <td class="num">${isFinite(r.cover)?r.cover.toFixed(1):'∞'}</td>
      <td class="num">${r.cost?r.cost.toFixed(2):'—'}</td>
      <td class="num">${dv?dv.toFixed(2):'—'}</td>
      <td>${esc(r.vendor)||'<span class="muted">—</span>'}</td>
      <td class="act">
        <button data-flag="${esc(r.key)}">${flagged.has(r.key)?'Unflag':'Flag'}</button>
        <button data-rm="${esc(r.key)}">Remove</button>
      </td></tr>`;
  }).join('') || `<tr><td colspan="15" class="muted" style="padding:24px;text-align:center">No products match this rule.</td></tr>`;

  const totDead=VIEW.reduce((s,r)=>s+r.excess*r.cost,0);
  const totUnits=VIEW.reduce((s,r)=>s+r.excess,0);
  const zero=VIEW.filter(r=>r.sales===0).length;
  $('stats').innerHTML = `
    <div class="stat"><label>Products in report</label><b>${ROWS.length.toLocaleString()}</b></div>
    <div class="stat"><label>Flagged as dead/over</label><b>${VIEW.length.toLocaleString()}</b></div>
    <div class="stat"><label>Zero sales</label><b>${zero.toLocaleString()}</b></div>
    <div class="stat"><label>Excess units</label><b>${totUnits.toLocaleString(undefined,{maximumFractionDigits:0})}</b></div>
    <div class="stat"><label>Excess value</label><b>${totDead.toLocaleString(undefined,{maximumFractionDigits:0})}</b></div>
    <div class="stat"><label>Marked flag / removed</label><b>${flagged.size} / ${removed.size}</b></div>`;

  const pages=Math.max(1,Math.ceil(VIEW.length/PAGE));
  $('pinfo').textContent = `${VIEW.length?start+1:0}–${Math.min(start+PAGE,VIEW.length)} of ${VIEW.length}  ·  page ${page+1}/${pages}`;
  $('prev').disabled=page<=0; $('next').disabled=page>=pages-1;
  drawCharts();
  save();
}

/* ---------- charts ---------- */
function drawCharts(){
  const box=$('viz');
  if(!$('showviz').checked){ box.classList.add('hide'); return; }
  box.classList.remove('hide');
  box.innerHTML='<div class="card" id="c1"></div><div class="card" id="c2"></div><div class="card" id="c3"></div>';

  const thr=num($('thr').value), mo=num($('months').value)||1;

  /* drill into subcategories once a single category is pinned — a one-bar chart says nothing */
  const catPinned=!!$('fcat').value;
  const byCat=topN(group(VIEW, r=>catPinned?r.sub:r.cat, r=>r.excess*r.cost), 8);
  barChart($('c1'), byCat, {title:'Where the money is stuck',
    cap:tailCap(byCat, catPinned?'subcategories':'categories', catPinned?'subcategory':'category','excess value'),
    unit:'excess value'});

  const steps=5, w=thr/steps;
  const bins=[{short:'none', n:VIEW.filter(r=>r.sales===0).length,
    tip:`<b>No sales at all</b><div class='t2'>${VIEW.filter(r=>r.sales===0).length.toLocaleString()} products</div>`}];
  for(let i=0;i<steps;i++){
    const lo=i*w, hi=(i+1)*w;
    const n=VIEW.filter(r=>r.sales>0 && r.ratio>lo && r.ratio<=hi).length;
    bins.push({short:`≤${hi.toFixed(0)}%`, n,
      tip:`<b>${lo.toFixed(0)}–${hi.toFixed(0)}% of stock sold</b><div class='t2'>${n.toLocaleString()} products</div>`});
  }
  colChart($('c2'), bins, {title:'How dead is dead',
    cap:`Products by sell-through over ${mo} month${mo>1?'s':''}`, xlab:'sales as % of current stock'});

  const vendPinned=!!$('fvend').value;
  const byVend=topN(group(VIEW, r=>vendPinned?r.brand:r.vendor, r=>r.excess*r.cost), 10);
  barChart($('c3'), byVend, {title:vendPinned?'What they sold you':'Who to talk to',
    cap:tailCap(byVend, vendPinned?'brands':'vendors', vendPinned?'brand':'vendor','excess value'),
    unit:'excess value'});

  bindTips(box);
}

/* ---------- events ---------- */
$('body').addEventListener('click',e=>{
  const f=e.target.dataset.flag, r=e.target.dataset.rm;
  if(f){ flagged.has(f)?flagged.delete(f):flagged.add(f); compute(); }
  if(r){ removed.add(r); compute(); }
});
$('head').addEventListener('click',e=>{
  const k=e.target.closest('th')?.dataset.k; if(!k) return;
  if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;}
  compute();
});
['months','thr','minstock','fcat','fbrand','fvend','q','showmode'].forEach(id=>{
  const el=$(id);
  el.addEventListener(el.tagName==='SELECT'?'change':'input', compute);
});
$('showviz').addEventListener('change',drawCharts);
$('prev').onclick=()=>{page--;render();};
$('next').onclick=()=>{page++;render();};
$('reset').onclick=()=>{ if(confirm('Clear all flags and restore removed rows?')){removed.clear();flagged.clear();compute();} };
$('export').onclick=()=>{
  downloadCSV(
    `deadstock_${$('thr').value}pct_${$('months').value}mo.csv`,
    ['Product ID','Product Name','Brand','Category','Subcategory','Unit','Stock','Sales','Sales %',
     'Excess','Sales per month','Months cover','Unit cost','Excess value','Vendor','Flagged'],
    VIEW.map(r=>[r.id,r.name,r.brand,r.cat,r.sub,r.unit,r.stock,r.sales,r.ratio.toFixed(2),
      r.excess.toFixed(2),r.perMonth.toFixed(2),isFinite(r.cover)?r.cover.toFixed(1):'',
      r.cost,(r.excess*r.cost).toFixed(2),r.vendor,flagged.has(r.key)?'YES':''])
  );
};

/* ---------- persistence ---------- */
function save(){ try{ localStorage.setItem('dsc',JSON.stringify({r:[...removed],f:[...flagged]})); }catch(e){} }
function loadState(){ try{
  const s=JSON.parse(localStorage.getItem('dsc')||'{}');
  (s.r||[]).forEach(k=>removed.add(k)); (s.f||[]).forEach(k=>flagged.add(k));
}catch(e){} }

/* ---------- boot ---------- */
function opts(sel, vals, label){
  sel.innerHTML = `<option value="">All ${label}</option>` +
    [...new Set(vals.filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join('');
}
function start(name){
  $('fileinfo').textContent = `${name} — ${ROWS.length.toLocaleString()} products`;
  $('dropzone').classList.add('hide');
  $('app').classList.remove('hide');
  opts($('fcat'),  ROWS.map(r=>r.cat),'categories');
  opts($('fbrand'),ROWS.map(r=>r.brand),'brands');
  opts($('fvend'), ROWS.map(r=>r.vendor),'vendors');
  loadState(); compute();
}
tipInit();
wireLoader({input:$('file'), dropzone:$('dropzone'), onload:start});
const cached = loadCachedReport();
if(cached) start(cached);
</script>
</body>
</html>
